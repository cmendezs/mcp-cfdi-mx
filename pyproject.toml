[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-cfdi-mx"
version = "0.3.0"
description = "MCP server for Mexican electronic invoicing (CFDI 4.0, Complemento de Pagos 2.0)"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Christophe Mendez" }]
keywords = [
    "mcp",
    "model-context-protocol",
    "einvoicing",
    "e-invoicing",
    "mexico",
    "cfdi",
    "sat",
    "pac",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
requires-python = ">=3.11"
dependencies = [
    "mcp-einvoicing-core>=1.30.0,<2.0.0",
    "pydantic>=2.0.0",
    "lxml>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "lxml-stubs>=0.5.1",
    "pre-commit>=4.5.1",
    "xlrd>=2.0.1",
]

[project.scripts]
mcp-cfdi-mx = "mcp_cfdi_mx.server:main"

[project.urls]
Homepage = "https://github.com/cmendezs/mcp-cfdi-mx"
Repository = "https://github.com/cmendezs/mcp-cfdi-mx"
Issues = "https://github.com/cmendezs/mcp-cfdi-mx/issues"
Changelog = "https://github.com/cmendezs/mcp-cfdi-mx/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_cfdi_mx"]

[tool.hatch.build.targets.sdist]
exclude = ["mcp-publisher", "dist/", ".github/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=mcp_cfdi_mx --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["N999", "E501"]  # E501: OVERRIDE-REASON comments in audit scripts are intentionally verbose

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["mcp_einvoicing_core", "mcp_einvoicing_core.*"]
ignore_missing_imports = true
